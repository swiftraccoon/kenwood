# Explicit target list: without this, cargo-deny uses the host platform
# only and silently filters out deps gated for other targets. CI runs on
# Linux x86_64 and sees redox-specific crates (parking_lot_core →
# redox_syscall) that macOS developers don't, leading to local "bans
# ok" but CI "bans FAILED". These triples cover every platform we ship
# to (macOS ARM, macOS x86, Linux x86, Linux ARM, Windows).
[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
ignore = [
  # Askama's derive macro uses basic-toml to parse its TOML configuration
  # while compiling UniFFI. No patched release or compatible replacement exists.
  # Remove when a compatible UniFFI/Askama update replaces this dependency.
  { id = "RUSTSEC-2026-0374", reason = "basic-toml is an unmaintained build-time parser used by Askama's derive macro through UniFFI; no patched release or compatible upstream replacement is available" },
]

[licenses]
version = 2
allow = [
  "GPL-2.0-or-later",
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # University of Illinois/NCSA Open Source License: the permissive license
  # carried by libfuzzer-sys's bundled LLVM libFuzzer runtime.
  "NCSA",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "BSL-1.0",
  "Zlib",
  # SIL Open Font License 1.1: used by epaint_default_fonts
  # (Ubuntu font family shipped with egui for sextant). Permissive
  # font licence that allows redistribution + derivative works.
  "OFL-1.1",
]
confidence-threshold = 0.8

# Font licensing remains scoped to the crate that bundles the fonts.
[[licenses.exceptions]]
# epaint_default_fonts also bundles the Ubuntu fonts under the
# Ubuntu Font Licence 1.0, identified upstream as Ubuntu-font-1.0.
# This exception applies to those bundled font files only.
allow = ["Ubuntu-font-1.0"]
name = "epaint_default_fonts"

[bans]
multiple-versions = "deny"
# Path dependencies in this workspace don't carry a `version = "..."`
# constraint; the dstar-gateway-* crates live in the kenwood monorepo
# and are consumed by sibling crates via path only (we are not
# publishing to crates.io). cargo-deny's `wildcards = "deny"` would
# otherwise flag every path dep as a wildcard. `allow-wildcard-paths`
# narrows the ban to non-path wildcards (e.g. `serde = "*"`).
wildcards = "deny"
allow-wildcard-paths = true
# Each entry names a whole release line (`crate@0.5`, `crate@1`), so a patch
# release that a fresh lockfile picks up stays covered.
skip = [
  # ─────────────────────────────────────────────────────────────────────
  # thd75 serial stack (serialport → mio-serial → tokio-serial)
  # ─────────────────────────────────────────────────────────────────────

  # serialport 4.x directly uses nix 0.26 (which itself uses bitflags 1).
  # Newer nix (0.28+) migrated to bitflags 2. Other crates in the tree
  # use bitflags 2. Can be dropped once serialport updates its nix pin.
  { crate = "bitflags@1" },

  # serialport 4.x uses nix 0.26 for Unix-specific serial port IOCTLs.
  # Dropable when serialport upgrades; tokio-serial pins serialport 4.x.
  { crate = "nix@0.26" },

  # ─────────────────────────────────────────────────────────────────────
  # thd75-repl directory detection (dirs-next → dirs-sys-next → redox_users)
  # ─────────────────────────────────────────────────────────────────────

  # winit's Wayland dependencies and dirs-next's Redox support still
  # use thiserror 1.x. Workspace crates use 2.x. Drop when the windowing
  # and directory-discovery stacks update their error derives.
  { crate = "thiserror@1" },

  # Proc-macro companion to thiserror 1.x. Tracks thiserror@1 exactly.
  { crate = "thiserror-impl@1" },

  # ─────────────────────────────────────────────────────────────────────
  # proc-macro ecosystem syn 2 → syn 3 migration
  # ─────────────────────────────────────────────────────────────────────

  # serde_derive 1.0.229 uses syn 3 while tracing-attributes, UniFFI's
  # macros and thiserror-impl 1.x still use syn 2.
  # The ecosystem split resolves upstream; dropable once every proc-macro
  # dependency has migrated and the tree converges on one syn major.
  { crate = "syn@2" },

  # ─────────────────────────────────────────────────────────────────────
  # sextant image stack (eframe → image → png → flate2)
  # ─────────────────────────────────────────────────────────────────────

  # png 0.18 depends on miniz_oxide 0.8 directly while flate2 1.1.10, which
  # png also depends on, moved to miniz_oxide 0.9. Both copies sit under
  # sextant's eframe → image → png chain. Dropable when png updates its
  # miniz_oxide pin to match flate2.
  { crate = "miniz_oxide@0.8" },

  # ─────────────────────────────────────────────────────────────────────
  # Windows platform crates 0.52
  # ─────────────────────────────────────────────────────────────────────
  #
  # serialport, winit and glutin use windows-sys 0.52 for Windows APIs.
  # Newer crates use windows-sys 0.61, built on the unified
  # `windows-link` crate. Drop when serialport, winit and glutin update.

  { crate = "windows-sys@0.52" },

  # ─────────────────────────────────────────────────────────────────────
  # sextant egui + cpal + winit transitive graph
  # ─────────────────────────────────────────────────────────────────────
  #
  # sextant (GUI test app for sextant↔sextant D-STAR traffic) pulls
  # in egui, cpal, and winit: three large GUI/audio stacks whose
  # own dep graphs sit at different maturity levels. The pairs
  # below are the "old" side of each duplicate; each will resolve
  # on its own cadence as egui/cpal/winit upgrade their transitive
  # graphs. None are security-sensitive: all have the security
  # advisories checked separately by `cargo-audit`.

  # winit uses smithay-client-toolkit 0.19 and calloop 0.13; egui's
  # clipboard support uses the 0.20 toolkit and calloop 0.14 through
  # smithay-clipboard. Drop when winit updates its Wayland stack.
  { crate = "calloop@0.13" },
  { crate = "calloop-wayland-source@0.3" },
  { crate = "smithay-client-toolkit@0.19" },

  # winit 0.30 and its core-graphics bindings use core-foundation 0.9;
  # serialport and rustls-platform-verifier use 0.10. Drop when winit
  # and core-graphics update their bindings.
  { crate = "core-foundation@0.9" },

  # winit 0.30 uses objc2 0.5 with its 0.2 app-kit and foundation
  # bindings; eframe, glutin and CPAL use objc2 0.6. Drop when winit
  # updates to the newer bindings.
  { crate = "objc2@0.5" },
  { crate = "objc2-app-kit@0.2" },
  { crate = "objc2-foundation@0.2" },
  { crate = "block2@0.5" },

  # ahash and wezterm-blob-leases use getrandom 0.3; tempfile and
  # jobserver use 0.4. Drop when the older consumers update.
  { crate = "getrandom@0.3" },

  # ratatui uses itertools 0.14 while egui uses 0.15. Drop when the
  # terminal UI stack updates its requirement.
  { crate = "itertools@0.14" },

  # Wayland clipboard MIME detection uses petgraph's hashbrown 0.15
  # and foldhash 0.1; indexmap and the UI stacks use hashbrown 0.17
  # and foldhash 0.2. Drop when petgraph updates its hash table.
  { crate = "hashbrown@0.15" },
  { crate = "foldhash@0.1" },

  # UniFFI's weedle2 parser uses nom 7; pcap-parser and the clipboard
  # MIME detector use nom 8. Drop when weedle2 updates its parser.
  { crate = "nom@7" },

  # winit and its Wayland dependencies use rustix 0.38; the REPL and
  # newer platform dependencies use 1.x. Drop when winit and its
  # Wayland stack update.
  { crate = "rustix@0.38" },
  { crate = "linux-raw-sys@0.4" },

  # rustix 0.38 uses windows-sys 0.59 while newer platform crates use
  # 0.61. Drop when the older rustix consumers update.
  { crate = "windows-sys@0.59" },

  # serialport's io-kit-sys uses mach2 0.4 while CPAL uses 0.6. Drop
  # when io-kit-sys updates its Mach API bindings.
  { crate = "mach2@0.4" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
