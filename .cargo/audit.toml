# cargo-audit configuration for the kenwood workspace.
#
# cargo-audit and cargo-deny use different advisory resolution logic, so
# the ignore lists are not identical. Entries here must match what
# cargo-audit actually detects in our Cargo.lock.

[advisories]
ignore = [
  # RUSTSEC-2026-0374: basic-toml is unmaintained, with no patched release.
  # Askama's derive macro uses it while compiling UniFFI binding templates.
  # A compatible UniFFI/Askama update does not remove it. Remove this entry
  # when that build-time dependency is replaced upstream.
  "RUSTSEC-2026-0374",
]
