[package]
name = "sextant"
version = "0.1.0"
authors = ["swiftraccoon"]
categories = ["multimedia", "network-programming"]
edition = "2024"
keywords = ["dstar", "ham-radio", "reflector", "gui"]
license = "GPL-2.0-or-later OR GPL-3.0-or-later"
publish = false
readme = "README.md"
repository = "https://github.com/swiftraccoon/kenwood"
rust-version = "1.99"
description = "Desktop GUI client for D-STAR reflectors (DExtra / DPlus / DCS)"

[[bin]]
name = "sextant"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
dirs-next = "2.0.0"
dstar-gateway = { path = "../dstar-gateway" }
dstar-gateway-core = { path = "../dstar-gateway-core" }
eframe = { version = "0.37.0", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
egui = "0.37.0"
hound = "3.5.1"
# Encoder and causal waveform enhancement are selected explicitly; RX enhancement
# remains an operator setting that defaults to raw decoder output.
mbelib-rs = { path = "../mbelib-rs", features = ["encoder", "wave-enhance"] }
ringbuf = "0.5.3"
rubato = "5.0.1"
time = { version = "0.3.55", default-features = false, features = [
    "formatting",
    "local-offset",
    "macros",
] }
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "signal",
] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "env-filter",
] }

[lints]
workspace = true
