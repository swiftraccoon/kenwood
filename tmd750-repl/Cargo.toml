[package]
name = "tmd750-repl"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Accessible command-line REPL for the Kenwood TM-D750 transceiver"
license = "GPL-2.0-or-later"
authors = ["swiftraccoon"]
repository = "https://github.com/swiftraccoon/kenwood"
readme = "README.md"
keywords = ["ham-radio", "kenwood", "accessibility", "amateur-radio"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
dstar-gateway = { path = "../dstar-gateway" }
dstar-gateway-core = { path = "../dstar-gateway-core" }
dirs-next = "2"
kenwood-thd75 = { path = "../thd75", default-features = false, features = [
  "dstar",
] }
kenwood-tmd750 = { path = "../tmd750" }
rustyline = "18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = [
  "formatting",
  "macros",
] }
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
