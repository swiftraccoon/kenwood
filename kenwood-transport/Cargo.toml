[package]
name = "kenwood-transport"
version = "0.1.0"
authors = ["swiftraccoon"]
categories = ["hardware-support", "asynchronous"]
edition = "2024"
keywords = ["kenwood", "serial", "transport", "async", "ham-radio"]
license = "GPL-2.0-or-later"
publish = false
readme = "README.md"
repository = "https://github.com/swiftraccoon/kenwood"
rust-version = "1.99"
description = "Model-neutral async byte transports and Tokio stream adapters"

[features]
default = ["serial"]
native-bluetooth = ["dep:cc"]
serial = ["dep:tokio-serial"]

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "io-util", "time"] }
tokio-serial = { version = "5", optional = true }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[build-dependencies]
cc = { version = "1", optional = true }

# KNOWN DIVERGENCE FROM WORKSPACE: unsafe is denied, not forbidden, solely
# for the audited native Bluetooth module. All other lint policy is identical.
[lints.rust]
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unsafe_code = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_qualifications = "deny"
unused_results = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
format_push_string = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
missing_const_for_fn = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
nursery = { level = "deny", priority = -1 }
panic = "deny"
pedantic = { level = "deny", priority = -1 }
redundant_pub_crate = "allow"
restriction = { level = "allow", priority = -1 }
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
missing_crate_level_docs = "deny"
private_intra_doc_links = "deny"
unescaped_backticks = "deny"
