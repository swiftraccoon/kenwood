[package]
name = "kenwood-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Model-neutral async byte transports and Tokio stream adapters"
license = "GPL-2.0-or-later"
repository = "https://github.com/swiftraccoon/kenwood"
keywords = ["kenwood", "serial", "transport", "async", "ham-radio"]
categories = ["hardware-support", "asynchronous"]
authors = ["swiftraccoon"]
readme = "README.md"
publish = false

[features]
default = ["serial"]
serial = ["dep:tokio-serial"]
native-bluetooth = ["dep:cc"]

[dependencies]
tokio = { version = "1", features = [
  "rt",
  "macros",
  "sync",
  "io-util",
  "time",
] }
tokio-serial = { version = "5", optional = true }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[build-dependencies]
cc = { version = "1", optional = true }

# KNOWN DIVERGENCE FROM WORKSPACE: unsafe is denied, not forbidden, solely
# for the audited native Bluetooth module. All other lint policy is identical.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_results = "deny"
elided_lifetimes_in_paths = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
non_ascii_idents = "deny"
single_use_lifetimes = "deny"
let_underscore_drop = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
restriction = { level = "allow", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_assert_message = "deny"
missing_const_for_fn = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
format_push_string = "deny"
infinite_loop = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
invalid_codeblock_attributes = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"
