[package]
name = "pulsar"
version = "0.1.0"
authors = ["swiftraccoon"]
categories = ["command-line-utilities", "multimedia::audio"]
edition = "2024"
keywords = ["ham-radio", "dmr", "recorder", "brandmeister"]
license = "GPL-2.0-or-later"
publish = false
readme = "README.md"
repository = "https://github.com/swiftraccoon/kenwood"
rust-version = "1.99"
description = "BrandMeister REWIND DMR voice recorder"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
dmr-rewind = { path = "../dmr-rewind" }
dmr-rewind-core = { path = "../dmr-rewind-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
