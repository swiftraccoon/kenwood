[package]
name = "pulsar"
version = "0.1.0"
authors = ["swiftraccoon"]
categories = ["command-line-utilities", "multimedia::audio"]
edition = "2024"
keywords = ["ham-radio", "dmr", "recorder", "brandmeister"]
license = "GPL-2.0-or-later"
publish = false
readme = "README.md"
repository = "https://github.com/swiftraccoon/kenwood"
rust-version = "1.99"
description = "BrandMeister REWIND DMR voice recorder"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
dmr-rewind = { path = "../dmr-rewind" }
dmr-rewind-core = { path = "../dmr-rewind-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
