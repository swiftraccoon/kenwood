[package]
name = "mbelib-rs"
version = "0.1.0"
authors = ["swiftraccoon"]
categories = ["multimedia::audio", "encoding"]
edition = "2024"
keywords = ["ambe", "dstar", "ham-radio", "audio", "codec"]
license = "GPL-2.0-or-later"
publish = false
readme = "README.md"
repository = "https://github.com/swiftraccoon/kenwood"
rust-version = "1.94"
description = "Pure Rust AMBE 3600x2400 voice codec for D-STAR digital radio"

[dependencies]
# Real-input FFT for JMBE-compatible unvoiced synthesis (Algorithms #117-126)
# and (when `encoder` is enabled) for the AMBE encode-side spectral analysis.
# Pure Rust, MIT/Apache-2.0 (compatible with our GPL outgoing license).
realfft = "3.4"
# SIMD primitives (f32x4 / i32x4) for the float→i16 conversion hot path.
# Pure Rust, MIT/Apache-2.0/Zlib.
wide = "0.7"

[features]
default = []
# AMBE 3600×2400 D-STAR encoder. Off by default because decode-only
# consumers are the common case. When enabled, ports Max H. Parke's
# OP25 `ambe_encoder.cc` + Pavel Yazev's `imbe_vocoder` analysis path.
# The implemented wire format is AMBE 3600x2400 only.
encoder = []
# Reference data lifted from the TH-D75 AMBE DSP firmware image
# (lawfully owned hardware, DMCA §1201(f) interoperability exception).
# Enabling this compiles the `encode::kenwood` module, a catalogue of
# coefficient tables and explicit InputFilter/EnvelopePostfilter choices.
# Feature unification leaves the default reference algorithms unchanged.
kenwood-tables = ["encoder"]
# Learned waveform enhancement: small complex-STFT masking networks
# (weights trained against reflector-published reference decodes of
# identical AMBE frames and adversarially fine-tuned, embedded as
# binary blobs) that regenerate fine structure the base synthesis
# cannot. Two variants compile in: `enhance_wave`, the offline
# whole-clip model with a bidirectional recurrent core, and
# `enhance_live`, its causal counterpart with a forward-only
# recurrence plus a streaming API for frame-at-a-time use. Off by
# default: opt-in post-processing, gated by blind operator listening
# before any release, and adds ~5.5 MiB of embedded weights.
wave-enhance = []

[dev-dependencies]
proptest = "1"

# Examples that depend on the encoder feature. Cargo silently skips a
# target whose `required-features` are off, so these are invisible to a
# plain `--all-targets` run; lint.sh compiles them via its
# `--all-features` pass and its per-feature mbelib-rs matrix.
[[example]]
name = "encode_ambe_stream"
required-features = ["encoder"]

[[example]]
name = "validate_quantize_vs_op25"
required-features = ["encoder"]

[[example]]
name = "validate_analysis_vs_op25"
required-features = ["encoder"]

[[example]]
name = "validate_dp_vs_op25"
required-features = ["encoder"]

[[example]]
name = "validate_bvec_vs_op25"
required-features = ["encoder"]

# Integration tests that depend on the encoder feature. Declaring them here with
# `required-features` means cargo skips compiling them entirely when the feature
# is off, instead of compiling them to empty crates that then trip
# `unused_crate_dependencies` for every dev-dep in the workspace.
[[test]]
name = "wave_parity"
required-features = ["wave-enhance"]

[[test]]
name = "wave_live_parity"
required-features = ["wave-enhance"]

[[test]]
name = "encoder_roundtrip"
required-features = ["encoder"]

[[test]]
name = "diagnostic_voice_pipeline"
required-features = ["encoder"]

[[test]]
name = "bit_layer_roundtrip"
required-features = ["encoder"]

[[test]]
name = "kenwood_tables_integrity"
required-features = ["kenwood-tables"]

[[test]]
name = "kenwood_hitl_anchors"
required-features = ["kenwood-tables"]

[lints]
workspace = true
