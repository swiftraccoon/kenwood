[[deviations]]
package = "kenwood-transport"
group = "rust"
lint = "unsafe_code"
level = "deny"
reason = "The audited native Bluetooth module requires a narrow source expectation; all other unsafe remains denied."

[[deviations]]
package = "kenwood-thd75"
group = "rust"
lint = "unsafe_code"
level = "deny"
reason = "The audited Vision bridge requires a narrow source expectation; all other unsafe remains denied."

[[deviations]]
package = "lodestar-core"
group = "rust"
lint = "unsafe_code"
level = "omitted"
reason = "UniFFI generates required unsafe ABI entry points; handwritten modules and the source allowlist retain their separate enforcement."

[[deviations]]
package = "lodestar-core"
group = "rust"
lint = "unused_qualifications"
level = "omitted"
reason = "Generated UniFFI scaffolding uses fully qualified paths in the crate root; handwritten qualification requires review."

[[deviations]]
package = "lodestar-core"
group = "clippy"
lint = "missing_const_for_fn"
level = "allow"
reason = "Generated UniFFI ABI entry points cannot be const functions."

[[deviations]]
package = "lodestar-core"
group = "clippy"
lint = "redundant_pub_crate"
level = "omitted"
reason = "Nursery denial remains effective; this bridge does not enable the workspace's redundant-visibility exception."

[[deviations]]
package = "azimuth-core"
group = "rust"
lint = "unsafe_code"
level = "omitted"
reason = "UniFFI generates required unsafe ABI entry points; handwritten modules and the source allowlist retain their separate enforcement."

[[deviations]]
package = "azimuth-core"
group = "rust"
lint = "unused_qualifications"
level = "omitted"
reason = "Generated UniFFI scaffolding uses fully qualified paths in the crate root; handwritten qualification requires review."

[[deviations]]
package = "azimuth-core"
group = "clippy"
lint = "missing_const_for_fn"
level = "allow"
reason = "Generated UniFFI ABI entry points cannot be const functions."
