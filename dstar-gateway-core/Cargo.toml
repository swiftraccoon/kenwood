[package]
name = "dstar-gateway-core"
version = "0.1.0"
authors = ["swiftraccoon"]
categories = ["network-programming", "parser-implementations"]
edition = "2024"
keywords = ["dstar", "ham-radio", "reflector", "amateur-radio"]
license = "GPL-2.0-or-later"
publish = false
readme = "README.md"
repository = "https://github.com/swiftraccoon/kenwood"
rust-version = "1.99"
description = "Sans-io core for the dstar-gateway D-STAR reflector library"

[dependencies]
thiserror = "2.0.21"
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }

[dev-dependencies]
proptest = "1.12.0"
static_assertions = "1.1.0"
trybuild = "1.0.122"

[lints]
workspace = true
