name: Azimuth

include:
  - path: project-local.yml
    optional: true

options:
  bundleIdPrefix: org.swiftraccoon.azimuth
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "11"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: YES

targets:
  AzimuthIPad:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iPad
        excludes:
          - Info.plist
          - Azimuth.entitlements
          - Settings.bundle
      - path: iPad/Settings.bundle
        buildPhase: resources
      - path: Generated
        optional: true
    dependencies:
      - framework: AzimuthCore.xcframework
        embed: false
      - sdk: FoundationModels.framework
      - sdk: Speech.framework
      - sdk: AVFAudio.framework
      - sdk: IOKit.framework
      - target: AzimuthDriver
        embed: true
        codeSign: true
    info:
      path: iPad/Info.plist
      properties:
        CFBundleDisplayName: Azimuth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: Azimuth uses audio input while you dictate an Assistant request or monitor the radio's USB IF output.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64, driverkit]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        PRODUCT_MODULE_NAME: Azimuth
        PRODUCT_BUNDLE_IDENTIFIER: org.swiftraccoon.azimuth.ipad
        SWIFT_OBJC_BRIDGING_HEADER: Shared/Transport/AzimuthIOKitShim.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: iPad/Azimuth.entitlements
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO

  AzimuthDriver:
    type: driver-extension
    platform: iOS
    sources:
      - path: Driver
        excludes:
          - Driver.entitlements
    dependencies:
      - sdk: DriverKit.framework
      - sdk: USBDriverKit.framework
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        PRODUCT_BUNDLE_IDENTIFIER: org.swiftraccoon.azimuth.ipad.driver
        INFOPLIST_FILE: Driver/Info.plist
        CODE_SIGN_ENTITLEMENTS: Driver/Driver.entitlements
        SDKROOT: driverkit
        SUPPORTED_PLATFORMS: driverkit
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        CLANG_CXX_LIBRARY: libc++
        DRIVERKIT_DEPLOYMENT_TARGET: "23.0"

  AzimuthMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
        excludes:
          - BluetoothHelper
          - Info.plist
          - Azimuth.entitlements
      - path: Generated
        optional: true
    dependencies:
      - framework: AzimuthCore.xcframework
        embed: false
      - sdk: FoundationModels.framework
      # USB-C remains the primary Azimuth transport. Native Bluetooth is the
      # alternate CAT link used, with consent, to inspect Menu 650 when USB-C
      # has returned a validated MMDVM version response.
      - sdk: IOBluetooth.framework
      - sdk: IOKit.framework
      - sdk: Vision.framework
      - target: AzimuthBluetoothHelper
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Azimuth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSBluetoothAlwaysUsageDescription: Azimuth uses the paired TH-D75 Bluetooth control link to restore CAT when USB-C is in MMDVM mode.
        NSBluetoothPeripheralUsageDescription: Azimuth uses the paired TH-D75 Bluetooth control link to restore CAT when USB-C is in MMDVM mode.
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_MODULE_NAME: Azimuth
        PRODUCT_BUNDLE_IDENTIFIER: org.swiftraccoon.azimuth.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: macOS/Azimuth.entitlements

  AzimuthBluetoothHelper:
    type: tool
    platform: macOS
    sources:
      - path: macOS/BluetoothHelper
        excludes:
          - AzimuthBluetoothHelper.entitlements
    dependencies:
      - framework: AzimuthCore.xcframework
        embed: false
      - sdk: Foundation.framework
      - sdk: IOBluetooth.framework
    settings:
      base:
        PRODUCT_NAME: AzimuthBluetoothHelper
        PRODUCT_BUNDLE_IDENTIFIER: org.swiftraccoon.azimuth.mac.bluetooth-helper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: macOS/BluetoothHelper/AzimuthBluetoothHelper.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_TESTABILITY: NO
        SKIP_INSTALL: YES
        OTHER_CODE_SIGN_FLAGS: "$(inherited) -i $(PRODUCT_BUNDLE_IDENTIFIER)"

  AzimuthTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: AzimuthMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.swiftraccoon.azimuth.mac.tests

schemes:
  AzimuthMac:
    build:
      targets:
        AzimuthMac: all
        AzimuthTests: [test]
    test:
      targets:
        - AzimuthTests
      preActions:
        - name: Restore Exact Bluetooth Helper Entitlements
          settingsTarget: AzimuthMac
          script: |
            set -eu
            app="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
            helper="${app}/Contents/MacOS/AzimuthBluetoothHelper"
            entitlements="${SRCROOT}/macOS/BluetoothHelper/AzimuthBluetoothHelper.entitlements"
            identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
            /usr/bin/codesign --force --sign "${identity}" \
              --preserve-metadata=identifier,flags \
              --entitlements "${entitlements}" \
              --generate-entitlement-der --timestamp=none "${helper}"
            /usr/bin/codesign --force --sign "${identity}" \
              --preserve-metadata=identifier,entitlements,flags \
              --generate-entitlement-der --timestamp=none "${app}"
    run:
      config: Debug
  AzimuthIPad:
    build:
      targets:
        AzimuthIPad: all
    run:
      config: Debug
