[package]
name = "mcp-d75-extract"
version = "0.1.0"
authors = ["swiftraccoon"]
categories = ["parser-implementations", "command-line-utilities"]
edition = "2024"
keywords = ["kenwood", "thd75", "mcp-d75", "ham-radio", "amateur-radio"]
license = "GPL-2.0-or-later"
publish = false
readme = "README.md"
repository = "https://github.com/swiftraccoon/kenwood"
rust-version = "1.99"
description = "Checked MCP memory-map extraction, registry generation and release comparison"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fancy-regex = "0.19.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"

[lints]
workspace = true
