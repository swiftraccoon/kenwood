[package]
name = "dstar-gateway"
version = "0.1.0"
authors = ["swiftraccoon"]
categories = ["network-programming", "hardware-support"]
edition = "2024"
keywords = ["dstar", "ham-radio", "reflector", "amateur-radio", "mmdvm"]
license = "GPL-2.0-or-later"
publish = false
readme = "README.md"
repository = "https://github.com/swiftraccoon/kenwood"
rust-version = "1.99"
description = "Tokio and synchronous drivers for D-STAR reflector clients"

[dependencies]
dstar-gateway-core = { path = "../dstar-gateway-core" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "time", "sync", "macros", "io-util", "rt"] }
tracing = "0.1.44"

[dependencies.reqwest]
default-features = false
features = ["rustls"]
optional = true
version = "0.13.5"

[features]
blocking = []
default = []
# Compiles the examples that require real network access at runtime.
examples-network = []
# Compiles ignored live-reflector tests; ordinary test runs remain local.
hardware-tests = []
# Explicit plaintext HTTP retrieval; responses have no authenticated provenance.
insecure-plaintext-xlx-directory = ["dep:reqwest"]

[dev-dependencies]
pcap-parser = "0.17.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }
trybuild = "1.0.122"

[dev-dependencies.tracing-subscriber]
default-features = false
features = ["fmt"]
version = "0.3.23"

# Network examples compile only when their required features are requested.
[[example]]
name = "04_send_voice_dplus"
required-features = ["examples-network"]

[[example]]
name = "05_receive_voice_with_diagnostics"
required-features = ["examples-network"]

[[example]]
name = "06_dprs_position_listener"
required-features = ["examples-network"]

[[example]]
name = "07_reconnect_with_backoff"
required-features = ["examples-network"]

[[example]]
name = "08_bridge_two_reflectors"
required-features = ["examples-network"]

[[example]]
name = "09_blocking_cli"
required-features = ["examples-network", "blocking"]

[[example]]
name = "10_record_session_to_file"
required-features = ["examples-network"]

# Live-reflector tests compile only with the explicit feature.
[[test]]
name = "hardware"
required-features = ["hardware-tests"]

[lints]
workspace = true
