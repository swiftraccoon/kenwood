[package]
name = "kenwood-thd75"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Async Rust library for controlling the Kenwood TH-D75 transceiver"
license = "GPL-2.0-or-later"
repository = "https://github.com/swiftraccoon/kenwood"
keywords = ["kenwood", "thd75", "ham-radio", "cat-protocol", "amateur-radio"]
categories = ["hardware-support", "encoding"]
authors = ["swiftraccoon"]
readme = "README.md"
documentation = "https://swiftraccoon.github.io/kenwood/"
publish = false

[dependencies]
tokio = { version = "1", features = [
  "rt",
  "macros",
  "sync",
  "io-util",
  "net",
  "time",
] }
tokio-serial = "5"
thiserror = "2"
tracing = "0.1"
# The sans-io `aprs` and `ax25-codec` crates are mandatory: the core CAT
# type layer builds on their validated types (GPS latitude/longitude,
# AX.25 callsigns in APRS settings). Only the client stacks are optional.
aprs = { path = "../aprs" }
aprs-is = { path = "../aprs-is", optional = true }
ax25-codec = { path = "../ax25-codec" }
dstar-gateway-core = { path = "../dstar-gateway-core" }
encoding_rs = "0.8"
kiss-tnc = { path = "../kiss-tnc", optional = true }
mmdvm-core = { path = "../mmdvm-core" }
mmdvm = { path = "../mmdvm", optional = true }

[features]
default = ["aprs", "dstar"]
# APRS client stack: the `thd75::aprs` client owning Radio + KISS session,
# the KISS TNC session itself, the KISS/APRS-IS error variants, and the
# aprs-is / kiss-tnc re-exports. CAT-level APRS settings, GPS types, and
# TNC mode commands stay in the core.
aprs = ["dep:aprs-is", "dep:kiss-tnc"]
# D-STAR reflector-gateway stack: `thd75::dstar_gateway` and the tokio MMDVM
# modem session. The Menu 650 terminal-mode lifecycle, MMDVM link diagnosis,
# and CAT D-STAR settings stay in the core (they need only `mmdvm-core`).
dstar = ["dep:mmdvm"]

[build-dependencies]
cc = "1"

[dev-dependencies]
proptest = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "test-util"] }
# Unconditional for test/example targets so their dep acknowledgements and
# direct protocol-layer use compile under --no-default-features; the lib's
# optional dependencies remain feature-gated for downstream consumers.
aprs-is = { path = "../aprs-is" }
kiss-tnc = { path = "../kiss-tnc" }
mmdvm = { path = "../mmdvm" }

# Integration tests that exercise the feature-gated `thd75::aprs` module.
[[test]]
name = "kiss_roundtrip"
required-features = ["aprs"]

[[test]]
name = "kiss_real_captures"
required-features = ["aprs"]

# These live-radio tools also contain offline unit tests. Register only those
# examples as test targets so the harness executes their tests, never `main`.
[[example]]
name = "automation_audit"
test = true

[[example]]
name = "config_backup"
test = true

[[example]]
name = "hardware_audit"
test = true

[[example]]
name = "identify"
test = true

[[example]]
name = "mcp_menu"
test = true

[[example]]
name = "verify_state"
test = true

# KNOWN DIVERGENCE FROM WORKSPACE: this crate declares its own [lints.*]
# blocks (cargo replaces, never merges, the workspace set). Divergences:
# - `unsafe_code` is `deny` rather than the workspace's `forbid`: this crate
#   needs two audited, scoped expectations for the IOBluetooth helper and
#   macOS Vision OCR bridge. Keeping the package-level deny applies the guard
#   to every Cargo library, test, and example target while allowing those two
#   reasoned expectations to operate. Manual hardware probes are source-audited
#   by `lint.sh` because they are deliberately not Cargo targets.
# - Everything else mirrors the workspace policy; see the inline notes.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_results = "deny"
# Prevent accidental future regressions
elided_lifetimes_in_paths = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_import_braces = "deny"
unused_qualifications = "deny"
non_ascii_idents = "deny"
single_use_lifetimes = "deny"
let_underscore_drop = "deny"
unused_crate_dependencies = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
restriction = { level = "allow", priority = -1 }
# Ban `#[allow]`: every suppression must be `#[expect(..., reason = "...")]`.
# Mirrors the root `[workspace.lints.clippy]` ban; restated here because this crate's
# `[lints]` block replaces the workspace one entirely (cargo does not merge).
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Restriction-lint denies mirror the workspace; no divergence.
undocumented_unsafe_blocks = "deny"
missing_assert_message = "deny"
missing_const_for_fn = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
# Forward-protection lints: mirror the workspace block exactly.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
format_push_string = "deny"
infinite_loop = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"

# Mirrors the workspace `[lints.rustdoc]` block; restated here because this crate's
# `[lints]` block replaces the workspace one entirely.
[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
invalid_codeblock_attributes = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"
