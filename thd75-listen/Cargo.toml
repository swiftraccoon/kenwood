[package]
name = "thd75-listen"
version = "0.1.0"
authors = ["swiftraccoon"]
categories = ["command-line-utilities", "multimedia::audio"]
edition = "2024"
keywords = ["ham-radio", "sdr", "ssb", "accessibility", "amateur-radio"]
license = "GPL-2.0-or-later"
publish = false
readme = "README.md"
repository = "https://github.com/swiftraccoon/kenwood"
rust-version = "1.99"
description = "Accessible SSB/CW/AM listener for the Kenwood TH-D75 USB IF stream"

[lib]
name = "thd75_listen"
path = "src/lib.rs"

[[bin]]
name = "thd75-listen"
path = "src/main.rs"

[dependencies]
if-dsp = { path = "../if-dsp" }
kenwood-thd75 = { path = "../thd75" }
# Matches sextant's cpal pin: two cpal majors cannot coexist (the
# alsa-sys `links = "alsa"` value must be unique in the graph).
cpal = "0.15"
rustyline = "18"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
thd75-repl = { path = "../thd75-repl" }

[lints]
workspace = true
