name: Fedora
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
# Superseded PR pushes cancel their stale runs; main pushes never
# cancel so every landed commit keeps a complete CI record.
concurrency:
  group: fedora-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Incremental artifacts are useless on throwaway runners and bloat
  # the cache; line-tables-only keeps file:line in backtraces while
  # skipping the full debuginfo that CI never loads in a debugger.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4
      # zstd: the cache action compresses with zstd when the binary is
      # present (falling back to much slower gzip when it is not), and
      # fedora:latest does not preinstall it.
      # git-core: the configuration-backup privacy checks fail closed
      # through git, which the base image also omits.
      # perl-Digest-SHA: the hardware-audit manifest hashes its evidence
      # with shasum; Fedora packages that executable separately.
      - run: dnf install -y gcc git-core perl-Digest-SHA zstd
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      # Cargo.lock is intentionally gitignored; resolve it first so
      # rust-cache gets a stable, content-addressed key.
      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
      # No `cargo check` / `cargo build` steps: clippy IS check plus
      # lints (and `--all-targets` covers strictly more targets), and
      # `cargo test` compiles and links the same lib/bin/example
      # targets. Neither dropped step produced artifacts the later
      # steps reuse; clippy's driver fingerprints differently from
      # check, so those passes were pure duplicate work.
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: thd75
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: thd75-tui
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: dstar-gateway
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: thd75-repl
      - run: cargo clippy --all-targets --features testing -- -D warnings
        working-directory: thd75-repl
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: mbelib-rs
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: stargazer
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: dmr-rewind-core
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: dmr-rewind
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: pulsar
      - run: cargo test
        working-directory: thd75
      - run: cargo test
        working-directory: thd75-tui
      - run: cargo test
        working-directory: dstar-gateway
      - run: cargo test
        working-directory: thd75-repl
      - run: cargo test --features testing
        working-directory: thd75-repl
      - run: cargo test
        working-directory: mbelib-rs
      - run: cargo test --features encoder
        working-directory: mbelib-rs
      - run: cargo test --features kenwood-tables
        working-directory: mbelib-rs
      - run: cargo test
        working-directory: mcp-d75-extract
      - run: cargo test
        working-directory: mmdvm-core
      - run: cargo test
        working-directory: mmdvm
      - run: cargo test --bins
        working-directory: stargazer
      - run: cargo test
        working-directory: dmr-rewind-core
      - run: cargo test
        working-directory: dmr-rewind
      - run: cargo test
        working-directory: pulsar
