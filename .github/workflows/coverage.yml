name: Coverage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: "0"
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: llvm-tools-preview
      # sextant (our GUI D-STAR client) pulls in cpal → alsa-sys on
      # Linux, which requires the ALSA development headers at build
      # time. `--workspace` coverage exercises the full dep graph, unlike
      # the platform workflows which build crates individually. Same
      # reason the Docs workflow installs this.
      - name: Install Linux audio headers (alsa for cpal/sextant)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Cargo.lock is intentionally gitignored; resolve it first so
      # rust-cache gets a stable, content-addressed key. The cache holds
      # the instrumented dep builds, which dominate this job's runtime.
      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # One instrumented run of every test target in every workspace
      # crate (unit + integration). This is also the only CI job that
      # executes the full workspace test suite on Linux, so a test
      # failure here must fail the job: no `|| true`.
      #
      # `--features testing` enables thd75-repl's `script_integration`
      # suite (behind `required-features`), which is otherwise invisible
      # to coverage. Only `testing` is named, so it does not turn on
      # `dstar-gateway/hardware-tests` (whose test opens live reflectors)
      # or the network example features. `--workspace --features testing`
      # resolves because a single member defines the feature; cargo
      # enables it only there.
      - run: cargo llvm-cov --workspace --features testing --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
