name: Ubuntu
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ubuntu-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  ci:
    name: Isolated packages (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy, rustfmt
      - name: Install Linux audio headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
      - name: Check every package with its own default features
        run: cargo run --quiet -p workspace-policy -- ci
      - name: Check transport without serial support
        working-directory: kenwood-transport
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo test --no-default-features
      - name: Check portable Bluetooth selectors without serial support
        working-directory: kenwood-transport
        run: |
          cargo clippy --all-targets --no-default-features --features native-bluetooth -- -D warnings
          cargo test --no-default-features --features native-bluetooth
      - name: Check CAT-only TH-D75
        working-directory: thd75
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo test --no-default-features
      - name: Check REPL integration feature
        working-directory: thd75-repl
        run: |
          cargo clippy --all-targets --features testing -- -D warnings
          cargo test --features testing
      - name: Check voice encoder feature variants
        working-directory: mbelib-rs
        run: |
          cargo test --features encoder
          cargo test --features kenwood-tables
      - name: Check isolated MMDVM feature variants
        working-directory: mmdvm
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo test --no-default-features
          for mmdvm_features in probe dstar; do
            cargo clippy --all-targets --no-default-features --features "$mmdvm_features" -- -D warnings
            cargo test --no-default-features --features "$mmdvm_features"
          done
      - name: Check isolated schema documentation
        run: cargo doc --no-deps --document-private-items --lib
        working-directory: kenwood-schema
        env:
          RUSTDOCFLAGS: "-D warnings"
          CARGO_TARGET_DIR: ../target/doc-schema
      - name: Check transport documentation with serial support
        run: cargo doc --no-deps --document-private-items --lib
        working-directory: kenwood-transport
        env:
          RUSTDOCFLAGS: "-D warnings"
          CARGO_TARGET_DIR: ../target/doc-transport-default
      - name: Check transport documentation without optional backends
        run: cargo doc --no-deps --document-private-items --no-default-features --lib
        working-directory: kenwood-transport
        env:
          RUSTDOCFLAGS: "-D warnings"
          CARGO_TARGET_DIR: ../target/doc-transport-core
      - name: Check isolated TM-D750 documentation
        run: cargo doc --no-deps --document-private-items --lib
        working-directory: tmd750
        env:
          RUSTDOCFLAGS: "-D warnings"
          CARGO_TARGET_DIR: ../target/doc-tmd750
      - name: Check isolated TM-D750 REPL documentation
        run: cargo doc --no-deps --document-private-items --bins
        working-directory: tmd750-repl
        env:
          RUSTDOCFLAGS: "-D warnings"
          CARGO_TARGET_DIR: ../target/doc-tmd750-repl
