name: Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  machete:
    name: Unused deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: taiki-e/install-action@cargo-machete
      - run: cargo machete thd75/
      - run: cargo machete thd75-tui/
      - run: cargo machete mbelib-rs/
      - run: cargo machete stargazer/
      - run: cargo machete dmr-rewind-core/
      - run: cargo machete dmr-rewind/
      - run: cargo machete pulsar/
      - run: cargo machete tmd750/
      - run: cargo machete tmd750-repl/
