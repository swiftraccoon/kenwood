name: macOS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  ci:
    name: Isolated packages (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
      - name: Check every package with its own default features
        run: cargo run --quiet -p workspace-policy -- ci
      - name: Check transport without optional backends
        working-directory: kenwood-transport
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo test --no-default-features
      # Native fixtures exercise processes and Objective-C objects without a radio.
      - name: Check native Bluetooth without serial support
        working-directory: kenwood-transport
        run: |
          cargo clippy --all-targets --no-default-features --features native-bluetooth -- -D warnings
          cargo test --no-default-features --features native-bluetooth
      - name: Check transport with serial and native Bluetooth
        working-directory: kenwood-transport
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
      - name: Check CAT-only TH-D75
        working-directory: thd75
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo test --no-default-features
      - name: Check REPL integration feature
        working-directory: thd75-repl
        run: |
          cargo clippy --all-targets --features testing -- -D warnings
          cargo test --features testing
      - name: Check voice encoder feature variants
        working-directory: mbelib-rs
        run: |
          cargo test --features encoder
          cargo test --features kenwood-tables
      - name: Check isolated MMDVM feature variants
        working-directory: mmdvm
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo test --no-default-features
          for mmdvm_features in probe dstar; do
            cargo clippy --all-targets --no-default-features --features "$mmdvm_features" -- -D warnings
            cargo test --no-default-features --features "$mmdvm_features"
          done
      - name: Check native-only transport documentation
        run: cargo doc --no-deps --document-private-items --no-default-features --features native-bluetooth --lib
        working-directory: kenwood-transport
        env:
          RUSTDOCFLAGS: "-D warnings"
          CARGO_TARGET_DIR: ../target/doc-transport-native
      - name: Check combined serial and native transport documentation
        run: cargo doc --no-deps --document-private-items --all-features --lib
        working-directory: kenwood-transport
        env:
          RUSTDOCFLAGS: "-D warnings"
          CARGO_TARGET_DIR: ../target/doc-transport-all
      - name: Check native TM-D750 REPL documentation
        run: cargo doc --no-deps --document-private-items --bins
        working-directory: tmd750-repl
        env:
          RUSTDOCFLAGS: "-D warnings"
          CARGO_TARGET_DIR: ../target/doc-tmd750-repl-native
