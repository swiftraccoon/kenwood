[package]
name = "thd75-repl"
version = "0.1.0"
authors = ["swiftraccoon"]
categories = ["command-line-utilities"]
edition = "2024"
keywords = ["ham-radio", "kenwood", "accessibility", "amateur-radio"]
license = "GPL-2.0-or-later"
publish = false
readme = "README.md"
repository = "https://github.com/swiftraccoon/kenwood"
rust-version = "1.99"
description = "Line-oriented CAT control and APRS KISS commands for the Kenwood TH-D75"

[lib]
name = "thd75_repl"
path = "src/lib.rs"

[[bin]]
name = "thd75-repl"
path = "src/main.rs"

[features]
# Adds `--mock-radio <scenario>` and deterministic integration fixtures.
testing = []

[dependencies]
aprs-is = { path = "../aprs-is" }
clap = { version = "4.6.7", features = ["derive"] }
dirs-next = "2.0.0"
dstar-gateway-core = { path = "../dstar-gateway-core" }
kenwood-thd75 = { path = "../thd75" }
kenwood-transport = { path = "../kenwood-transport", default-features = false }
mmdvm = { path = "../mmdvm", features = ["dstar"] }
rustyline = "19.0.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Checked offsets, presentation timestamps and session log filenames.
[dependencies.time]
default-features = false
features = ["formatting", "local-offset", "macros"]
version = "0.3.55"

[dependencies.tokio]
features = ["rt-multi-thread", "macros", "sync", "time", "signal"]
version = "1.54.1"

[dev-dependencies]
proptest = "1.12.0"

[target.'cfg(target_os = "macos")'.dependencies.kenwood-transport]
default-features = false
features = ["native-bluetooth"]
path = "../kenwood-transport"

# KNOWN DIVERGENCE FROM WORKSPACE: a crate-local [lints.<group>] block
# fully REPLACES the workspace block (no merge). Both blocks below
# restate the workspace policy in full; the only differences are the
# workspace-allowed lints restated explicitly (module_name_repetitions,
# multiple_crate_versions, redundant_pub_crate). This crate contains no
# FFI and keeps `unsafe_code = "forbid"`.
[lints.rust]
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unsafe_code = "forbid"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_qualifications = "deny"
unused_results = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
restriction = { level = "allow", priority = -1 }
# Match workspace restriction-lint policy
indexing_slicing = "deny"
missing_assert_message = "deny"
missing_const_for_fn = "deny"
undocumented_unsafe_blocks = "deny"
# `#[allow]` ban: see root workspace.lints.clippy for rationale.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Forward-protection lints: mirror the workspace block exactly.
dbg_macro = "deny"
expect_used = "deny"
format_push_string = "deny"
infinite_loop = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
panic = "deny"
redundant_pub_crate = "allow"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

# Mirrors the workspace `[lints.rustdoc]` block; restated here because this crate's
# `[lints]` block replaces the workspace one entirely.
[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
missing_crate_level_docs = "deny"
private_intra_doc_links = "deny"
unescaped_backticks = "deny"

# Integration test that spawns the REPL binary with mock radio + fixture scripts.
# Declaring `required-features = ["testing"]` here means cargo skips compiling it entirely
# when the feature is off, avoiding an unused_crate_dependencies report for every dev-dep
# on the empty-crate compilation unit.
[[test]]
name = "script_integration"
required-features = ["testing"]
