[package]
name = "if-dsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Sans-io DSP for a 12 kHz low-IF audio stream: mixing, filtering, SSB/CW/AM demodulation, AGC, spectrum estimation"
license = "GPL-2.0-or-later"
authors = ["swiftraccoon"]
repository = "https://github.com/swiftraccoon/kenwood"
keywords = ["dsp", "sdr", "ssb", "ham-radio", "amateur-radio"]
categories = ["multimedia::audio", "science"]
publish = false

[dependencies]
rustfft = "6"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
