[package]
name = "lodestar-core"
version = "0.1.0"
authors = ["swiftraccoon"]
categories = ["multimedia", "api-bindings"]
edition = "2024"
keywords = ["dstar", "ham-radio", "ios", "kenwood", "th-d75"]
license = "GPL-2.0-or-later OR GPL-3.0-or-later"
publish = false
readme = "README.md"
repository = "https://github.com/swiftraccoon/kenwood"
rust-version = "1.99"
description = "Rust control, reflector and audio core for the Lodestar TH-D75 app"

[lib]
crate-type = ["lib", "staticlib"]
name = "lodestar_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# UniFFI `tokio` feature enables `#[uniffi::export(async_runtime = "tokio")]`
# which we need for the reflector session's async FFI surface.
uniffi = { version = "0.31", features = ["cli", "tokio"] }
# Sans-io D-STAR types (Callsign, Module, ProtocolKind, hosts file parsing, etc.)
dstar-gateway-core = { path = "../dstar-gateway-core" }
# Async tokio shell for reflector sessions (UDP socket + session loop).
dstar-gateway = { path = "../dstar-gateway" }
# Sans-io MMDVM wire-frame codec (`[0xE0, len, cmd, payload...]`).
mmdvm-core = { path = "../mmdvm-core" }
# AMBE 3600x2400 decode plus the causal live waveform enhancer for
# always-enhanced on-device reflector audio monitoring.
mbelib-rs = { path = "../mbelib-rs", features = ["wave-enhance"] }
# Runtime: reused across FFI calls that drive reflector I/O.
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "io-util"] }
# Error wrapping for the FFI-visible ReflectorError enum.
thiserror = "2"
# Tracing for diagnostics inside the async session tasks.
tracing = { version = "0.1", default-features = false }
# Registry + filter layers used when we configure a subscriber.
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
uniffi = { version = "0.31", features = ["bindgen-tests"] }

# KNOWN DIVERGENCE FROM WORKSPACE: inherit workspace strictness but opt
# out of `unsafe_code` enforcement because UniFFI's generated scaffolding
# emits `#[unsafe(no_mangle)]`, fundamental to the Rust-to-Swift FFI.
# This crate exists for that FFI, so unsafe is inherent to its purpose.
# The `kenwood-transport` Bluetooth helper and `kenwood-thd75` Vision OCR
# bridge instead retain package-level denial with narrow audited exceptions.
[lints.rust]
elided_lifetimes_in_paths = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unused_results = "deny"
# `unused_qualifications = "deny"` is intentionally omitted: UniFFI's
# generated scaffolding emits fully qualified paths like
# `std::vec::Vec<u8>` that trip this lint, and the scaffolding is
# spliced into lib.rs by `include_scaffolding!`, so the lint cannot be
# scoped out of the generated code. NOTE: no clippy lint backstops this
# for hand-written code; redundant qualification here is caught only
# in review.
let_underscore_drop = "deny"
non_ascii_idents = "deny"
single_use_lifetimes = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
expect_used = "deny"
indexing_slicing = "deny"
missing_assert_message = "deny"
nursery = { level = "deny", priority = -1 }
panic = "deny"
pedantic = { level = "deny", priority = -1 }
restriction = { level = "allow", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
# Ban `#[allow]`: every suppression must be `#[expect(..., reason = "...")]`.
# Mirrors the root `[workspace.lints.clippy]` ban; restated here because this crate's
# `[lints]` block replaces the workspace one entirely (cargo does not merge).
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Forward-protection lints; these mirror the workspace block exactly.
dbg_macro = "deny"
format_push_string = "deny"
infinite_loop = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
todo = "deny"
unimplemented = "deny"
# UniFFI's generated scaffolding declares top-level FFI functions
# (`extern "C" fn ...`) that clippy flags as candidates for `const`.
# They can't be const; they're the `#[unsafe(no_mangle)]` FFI surface.
# Allowing here rather than per-file because the scaffolding is emitted
# directly into `lib.rs` by `include_scaffolding!` and cannot be scoped.
missing_const_for_fn = "allow"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
missing_crate_level_docs = "deny"
private_intra_doc_links = "deny"
unescaped_backticks = "deny"
