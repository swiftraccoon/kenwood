[package]
name = "stargazer"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "D-STAR reflector voice recorder — archives raw AMBE frames, decoded WAV, and metadata per transmission"
license = "GPL-2.0-or-later"
publish = false

[dependencies]
dstar-gateway = { path = "../dstar-gateway" }
dstar-gateway-core = { path = "../dstar-gateway-core" }
mbelib-rs = { path = "../mbelib-rs" }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
  "time",
  "net",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
