[package]
name = "dstar-gateway-server"
version = "0.1.0"
authors = ["swiftraccoon"]
categories = ["network-programming"]
edition = "2024"
keywords = ["dstar", "ham-radio", "reflector", "amateur-radio"]
license = "GPL-2.0-or-later"
publish = false
readme = "README.md"
repository = "https://github.com/swiftraccoon/kenwood"
rust-version = "1.94"
description = "Multi-client D-STAR reflector server (DPlus, DExtra, DCS)"

[dependencies]
dstar-gateway-core = { path = "../dstar-gateway-core" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }

[dependencies.tokio]
features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"]
version = "1"

[[bin]]
name = "polaris"
path = "src/bin/polaris.rs"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
trybuild = "1"

[dev-dependencies.tracing-subscriber]
default-features = false
features = ["env-filter", "fmt", "json"]
version = "0.3"

[lints]
workspace = true
