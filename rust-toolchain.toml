# Pin the workspace to the Rust version CI uses (dtolnay/rust-toolchain
# in .github/workflows pins 1.99.1). Without this file, a local
# `rustup update` moves the default stable ahead of CI and ./lint.sh
# fails on clippy lints that don't exist in CI's toolchain.
[toolchain]
channel = "1.99.1"
components = ["clippy", "llvm-tools-preview", "rustfmt"]
